# Evaluation configuration. Copy to .benchmarks/configs/my-run.yaml and customize.
# Run: sensemem-bench eval --config .benchmarks/configs/my-run.yaml --limit 1
# --limit counts dataset-specific units, which can contain many questions.
# See docs/benchmarking.md and docs/configuration.md for the complete contracts.
#
# Precedence: command-line flag > explicit file value > environment > built-in default.
# The runner allocates a separate physical data_dir per independent unit.

embedding:
  provider: openai
  base_url: http://127.0.0.1:8000/v1
  # Replace or remove placeholders; explicit api_key values override environment lookup.
  api_key: local-server-ignores-this
  model: your-embedding-model
  # Must match the endpoint's actual vector width.
  dimension: 1024
  modalities: [text]
  # Use messages for a compatible multimodal embeddings server.
  request_format: input
  timeout: 600.0
  max_retries: 3

# Optional local speech analysis. Omit when the corpus needs no speech backend.
speech:
  provider: funasr
  device: auto

generation:
  provider: openai
  base_url: https://your-endpoint.example/v1
  # Remove to use SENSEMEM_GENERATION_API_KEY, then OPENAI_API_KEY.
  api_key: replace-me
  model: your-vlm
  # Declare only modalities the endpoint accepts.
  modalities: [text, image, video]
  # Optional output ceiling; reasoning tokens also consume it on reasoning models.
  # max_tokens: 4096
  video_limit: 8
  # Provider-specific setting: remove or adapt it for other model servers.
  extra_body:
    chat_template_kwargs:
      enable_thinking: false
  # Sampling is harness-owned: use --gen-kwargs temperature=0.7 and benchmark.run.seed.
  # generation.temperature and generation.seed are not accepted in evaluation files.

# Optional formation runs after source commit and adds evidence-linked typed records.
# formation:
#   provider: openai
#   base_url: https://your-endpoint.example/v1
#   api_key: replace-me
#   model: your-llm
#   modalities: [text, image]
#   max_tokens: 4096

settings:
  index_speech: true
  # Admission uses gate_relevance, not the final SearchHit.score.
  minimum_relevance: 0.10
  ambiguity_margin: 0.01
  # Soft grounding budget, below the SDK's 24000 default. Mandatory raw hits can exceed it;
  # derived assertions require their eligible source closure to fit. This is not a token cap.
  evidence_budget_chars: 12000
  # The evaluator disables automatic answer reinforcement for reproducible question ordering.

# Harness settings are removed before passing the composition to Memory.from_config().
benchmark:
  # Omit this section to reuse the generation endpoint as judge. Official metrics can require
  # a different named judge; --list-tasks identifies it.
  judge:
    model: your-judge-model
    base_url: https://your-endpoint.example/v1
    # Remove to use SENSEMEM_JUDGE_API_KEY, then the resolved generation key.
    api_key: replace-me
    timeout_seconds: 600

  # Optional process-global vLLM observations. Shared traffic can affect these deltas.
  server_metrics:
    generation_url: null
    embedding_url: null
    timeout_seconds: 5

  download:
    # Defaults: <repository>/.benchmarks and <benchmarks_root>/data.
    # benchmarks_root: /corpus/.benchmarks
    # data_root: /corpus/.benchmarks/data
    # hf_home: /corpus/huggingface
    hf_endpoint: https://huggingface.co
    youtube_sleep_seconds: 30

  # Maximum relative regression, requiring run.compare or --compare.
  # performance_budgets:
  #   answer_e2e_ttft_p95: 0.10
  #   answer_e2e_latency_p95: 0.10
  #   retrieval_e2e_latency_p95: 0.15
  #   tokens_per_call: 0.05
  #   answer_throughput: 0.10

  run:
    tasks: locomo-refined,clbench
    # sensemem, blind, full-context, random, compile; baseline scores are non-official.
    arms: sensemem
    full_context_chars: 128000
    compile_max_items: 24
    compile_max_chars: 16000
    compile_allow_partial_sources: false
    # add returns searchable; capture measures capture followed by explicit settlement.
    ingest: add
    # all (or -1), a fraction between 0 and 1, or an absolute unit count.
    limit: all
    offset: 0

    unit_concurrency: 1
    # Above 1 requires static corpora, add mode, and no deliberation/formation/speech/face.
    ingest_concurrency: 1
    request_concurrency: 4
    # false uses buffered ask; true uses ask_stream and exposes caller TTFT.
    stream_answers: true
    # false skips standalone search-latency replay after answering; answer retrieval still runs.
    search_replay: true
    judge_concurrency: 8
    batch_size: auto
    max_batch_size: 64
    recall_limit: 20
    # null keeps the task's policy; strict or best_effort overrides it.
    answer_policy: null

    # One integer fills all four RNG slots; three- and four-integer forms are also supported.
    seed: 0
    bootstrap_samples: 2000
    repeat_index: 0
    device: null
    device_lock: true

    # Defaults: UTC timestamp run_id and <benchmarks_root>/results/<run_id> output.
    run_id: null
    output_path: null
    overwrite: false
    log_samples: false
    # Response cache directory or .db path; cached runs are not performance baselines.
    use_cache: null
    predict_only: false
    # Judge and report each completed task; false defers judging until all tasks finish.
    stream_results: true
    download: true
    allow_unverified_data: false
    verbosity: INFO
    quiet: false

    compare: null
    fail_on_regression: false
    regression_threshold: 0.0

    # Per-task input overrides:
    # task_data:
    #   clbench: /corpus/clbench/custom.json
    # media_root:
    #   video-mme-v2: /corpus/video-mme-v2/videos
    # media_manifest: /corpus/prepared/media-manifest.jsonl

# Invocation-only flags include --resume, --blind, --blind-baseline, --deliberate,
# --fallback-reference-at, --list-tasks, and --check-integrity.
# --gen-kwargs also selects supported sampling controls and provider-specific generation fields.
