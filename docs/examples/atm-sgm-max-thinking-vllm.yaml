# Copy to an ignored local directory and replace all service URLs and input paths.
# Supply generation and judge credentials through the documented environment variables.
embedding:
  provider: openai
  base_url: http://127.0.0.1:8000/v1
  api_key: EMPTY
  model: tencent/WeMM-Embedding-9B
  dimension: 4096
  modalities: [text, image, video]
  request_format: messages
  image_max_pixels: 4194304
  timeout: 180.0
  max_retries: 2
generation:
  provider: openai
  base_url: http://127.0.0.1:8001/v1
  model: deepseek-v4.1-flash
  modalities: [text, image, video]
  answer_style: concise
  answer_format: text
  image_max_pixels: 1048576
  request_max_bytes: 33554432
  video_limit: 8
  media_policy: all
  media_max_items: 8
  response_format: json_schema
  timeout: 240.0
  max_retries: 2
  extra_body:
    thinking:
      type: enabled
    reasoning_effort: max
vision: null
reranking:
  provider: vllm
  base_url: http://127.0.0.1:8002
  api_key: EMPTY
  model: Qwen3-VL-Rerank-8B
  modalities: [text, image, video]
  batch_size: 32
  media_candidates: 40
  media_weight: 0.5
  timeout: 240.0
settings:
  retrieval_mode: hybrid
  index_quantization: none
  evidence_budget_chars: 64000
  reinforce_on_answer: false
  query_vision: true
  recall_planning: true
  recall_query_expansion: true
  recall_rounds: 2
  recall_max_queries: 2
  recall_set_budget_chars: 64000
  recall_set_max_rows: 100
formation: null
consolidation: null
speech: null
face: null
retention: null
benchmark:
  judge:
    model: gpt-5-mini
    base_url: http://127.0.0.1:8003/v1
    timeout_seconds: 240.0
  download:
    benchmarks_root: .benchmarks/atm-inputs
  run:
    tasks: atm-bench-main-sgm
    arms: sensemem
    seed: 0
    recall_limit: 20
    answer_policy: strict
    batch_size: '4'
    max_batch_size: 4
    unit_concurrency: 16
    ingest_concurrency: 16
    request_concurrency: 16
    judge_concurrency: 16
    stream_answers: false
    stream_results: true
    log_samples: true
    download: false
